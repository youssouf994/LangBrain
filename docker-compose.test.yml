# Postgres usa-e-getta per provare la suite (e solo quella): credenziali di PROVA, nessun volume, porta 55433.
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_PG_URL=postgresql://postgres:prova@localhost:55433/langbrain_test python -m pytest tests -q
#   docker compose -f docker-compose.test.yml down
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: prova
      POSTGRES_DB: langbrain_test
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langbrain_test"]
      interval: 2s
      timeout: 3s
      retries: 20
