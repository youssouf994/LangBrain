# Migrazioni del database di LangBrain (Alembic).
#
# L'URL non sta qui: lo decide `app/core/archivio.py` (SQLite in DB_PATH, oppure Postgres con LANGBRAIN_DB_BACKEND e
# LANGBRAIN_DB_URL), così il comando e l'applicazione parlano sempre con lo stesso database.
#
#   alembic upgrade head                              porta lo schema all'ultima revisione
#   alembic current                                   la revisione del database
#   alembic revision --autogenerate -m "descrizione"  nuova revisione dalle differenze con app/db/schema.py
#   alembic downgrade -1                              annulla l'ultima revisione
#
# Dettagli e regole per scrivere le revisioni: docs/MIGRAZIONI.md.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
