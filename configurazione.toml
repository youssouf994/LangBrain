# Configurazione delle scelte dell'utente di LangBrain.
#
# Il file .env resta per segreti e parametri d'ambiente (chiavi API, URL, percorso del database).
# Qui vanno le scelte strutturate: quali dispositivi esistono e quali valori accettano, e la politica di ripiego dei
# provider LLM. Priorità: variabile d'ambiente > questo file > default nel codice.
# Il file viene riletto a caldo quando cambia: non serve riavviare il server. Se la nuova versione è errata resta
# attiva la precedente e l'errore compare nel log.
#
# Percorso alternativo: variabile d'ambiente LANGBRAIN_CONFIG. Ogni nome si può scrivere anche in inglese
# (config.example.toml è questo file in inglese, da copiare come config.toml).

[generale]
# Lingua dei prompt predefiniti del Brain e degli agenti, dei messaggi dell'API e delle pagine web: "it" o "en".
lingua = "it"

# ---------------------------------------------------------------------------
# Modelli LLM
# ---------------------------------------------------------------------------
[llm]
# false: un errore del provider o del modello scelto ferma il grafo e passa la palla all'operatore (HITL).
# true: prova in silenzio gli altri provider (nell'ordine sotto) e i modelli di ripiego. Sostituibile con MAO_FALLBACK.
fallback = false

# Ordine dei provider provati quando il ripiego è attivo (dopo il provider scelto con DEFAULT_PROVIDER).
ordine_provider = ["google_studio", "mistral", "openrouter", "local"]

# Modelli di ripiego per provider, usati solo con fallback = true. Tenere solo modelli gratuiti o molto economici:
# il ripiego scatta in silenzio. Con un elenco vuoto si prova solo il modello configurato nel .env.
[llm.modelli_di_ripiego]
openrouter = ["google/gemma-4-31b-it:free", "nvidia/nemotron-3-super-120b-a12b:free"]
mistral = ["ministral-3b-latest"]
google_studio = ["gemini-flash-latest"]

# ---------------------------------------------------------------------------
# Human-in-the-Loop: timer di attesa dell'operatore
# ---------------------------------------------------------------------------
[hitl]
# 1: quando il grafo si ferma in attesa dell'operatore parte un timer; il tempo rimanente è esposto via API
#    (GET /graph/state, GET /hitl/scadenze). 0: nessun timer, il grafo attende senza limite.
timer_attivo = 0

# Durata predefinita del timer, in secondi. Vale se il timer è attivo; `max_wait_seconds` di POST /hitl/config,
# se impostato, la sostituisce a runtime.
timer_predefinito_secondi = 300

# Cosa succede alla scadenza:
#   "umano":    il grafo resta in pausa e aspetta l'operatore; l'API segnala solo che il timer è scaduto.
#   "sistema":  decide il sistema: la richiesta prosegue come se l'HITL non fosse configurato, cioè il Brain la
#               valuta con il suo modello. Per le pause di emergenza non c'è nulla da decidere: un guasto non risolto
#               viene registrato senza altre azioni e un LLM non disponibile annulla il ciclo.
#   "respingi": la richiesta viene respinta in automatico (nessuna azione fisica viene eseguita).
azione_alla_scadenza = "umano"

# Dove si applica l'HITL. Sono due flussi separati, con regole proprie:
#   "nodi":    i nodi del grafo si fermano prima di eseguire (o dopo aver proposto un'azione), secondo le regole di
#              POST /hitl/config (hitl_all, hitl_nodes, hitl_targets, hitl_actions). Il Brain decide da solo le escalation.
#   "brain":   il Brain, quando valuta un'escalation su un dispositivo protetto, chiede prima all'operatore. I nodi
#              non si fermano mai.
#   "entrambi": tutti e due i flussi (una stessa richiesta può essere chiesta due volte).
# Le pause di emergenza (LLM non utilizzabile, guasto non risolto) restano attive con qualsiasi livello.
livello = "entrambi"

# Dispositivi per cui il Brain chiede sempre l'approvazione nel flusso "brain", in aggiunta a hitl_targets di
# POST /hitl/config e a hitl_all. Lista vuota: nessun dispositivo protetto per default.
target_critici_brain = ["alarm_system", "front_door_lock"]

# ---------------------------------------------------------------------------
# Dati dimostrativi
# ---------------------------------------------------------------------------
[demo]
# 1: a ogni avvio il database riceve un evento di conflitto di prova (FORCE_SHUTDOWN su ac_living_room).
# 0 (consigliato): nessun dato di prova viene scritto in automatico; per uno scenario di prova usare
# examples/crea_scenario.py.
conflitto_all_avvio = 0

# 1: l'API serve la pagina dimostrativa su GET /demo, che mostra il grafo in azione (vedi examples/avvia_demo.py).
# La pagina è statica e non contiene segreti: le chiamate all'API richiedono comunque la chiave. 0: /demo risponde 404.
pagina_web = 1

# ---------------------------------------------------------------------------
# Segnali dei recettori
# ---------------------------------------------------------------------------
[segnali]
# Quanto indietro (in ore) si tengono i segnali dei recettori nello stato di ogni esecuzione del grafo: i più vecchi
# vengono scartati. I segnali numerici sono anche salvati nel sistema nervoso (GET /signals, GET /signals/stats).
finestra_ore = 4

# ---------------------------------------------------------------------------
# Dispositivi
# ---------------------------------------------------------------------------
[politica]
# Cosa fare con un dispositivo che non compare nell'elenco qui sotto:
#   "rifiuta": nessun agente, override o scrittura via API può comandarlo (consigliato).
#   "consenti": qualsiasi valore è accettato per i dispositivi non elencati.
dispositivi_non_elencati = "rifiuta"

# Ogni sezione [dispositivi.<nome>] elenca ciò che il dispositivo accetta come comando. Il nome può essere un pattern
# con * e ? (es. "device_l*"); vale la prima regola che corrisponde, prima il nome esatto.
#   valori         valori testuali ammessi (senza distinguere maiuscole/minuscole)
#   intervallo     [minimo, massimo] per i valori numerici
#   unita          unità facoltativa dei numeri (es. "°C", "%"): "22.5°C" e "22.5" sono equivalenti
#   valore_attivo  valore inviato quando un agente decide genericamente di "attivare" il dispositivo (default "ON")
# I flag interni del sistema (REJECTED, RECONCILED_*, ...) non sono valori fisici e non vengono mai validati qui.
# Una sezione senza valori né intervallo accetta qualsiasi valore per quel dispositivo.

[dispositivi.ac_living_room]
valori = ["OFF", "ON"]
intervallo = [10.0, 35.0]
unita = "°C"
valore_attivo = "22.5°C"

[dispositivi.heater_bedroom]
valori = ["OFF", "ON"]
intervallo = [10.0, 35.0]
unita = "°C"
valore_attivo = "22.5°C"

[dispositivi.front_door_lock]
valori = ["LOCKED", "UNLOCKED"]
valore_attivo = "LOCKED"

[dispositivi.alarm_system]
valori = ["ARMED", "DISARMED"]
valore_attivo = "ARMED"

[dispositivi.living_room_lights]
valori = ["ON", "OFF"]
intervallo = [0.0, 100.0]
unita = "%"
valore_attivo = "ON"

[dispositivi.cardiac_pacemaker]
intervallo = [30.0, 220.0]
unita = "BPM"

[dispositivi.oxygen_regulator]
intervallo = [0.0, 100.0]
unita = "%"

# Leve della rete energetica simulata (pagina /energia, agenti in app/agents/agenti_energia.py).
[dispositivi."rete_el_*"]
valori = ["ON", "OFF"]
valore_attivo = "ON"

[dispositivi."rete_gas_*"]
valori = ["ON", "OFF"]
valore_attivo = "ON"

# Dispositivi usati dalle demo e dagli script di smoke test.
[dispositivi.vault_door]
valori = ["LOCKED", "UNLOCKED", "OPEN", "CLOSED"]
valore_attivo = "LOCKED"

[dispositivi.security_perimeter]
valori = ["ON", "OFF"]

[dispositivi.access_control]
valori = ["ON", "OFF"]

[dispositivi."device_l*"]
valori = ["ON", "OFF"]

# ---------------------------------------------------------------------------
# Organismo: organi esterni
# ---------------------------------------------------------------------------
# Attori che scrivono eventi sul sistema nervoso senza essere nodi del grafo (una centrale di sicurezza, un sistema
# esterno, un agente di un altro processo). Il livello li colloca nella gerarchia (1 = organo, 2+ = componente) nelle
# statistiche; la priorità pesa i loro blocchi sui dispositivi come quella di un agente registrato
# (senza priorità dichiarata un blocco di un attore sconosciuto prevale sempre, per prudenza).
# Un agente registrato con lo stesso nome prevale su questa dichiarazione.
[organismo.attori_esterni.agent_security]
livello = 1
priorita = 500.0
descrizione = "Organo di sicurezza: blocca i dispositivi quando rileva un rischio (es. finestra aperta con il clima acceso)."

# ---------------------------------------------------------------------------
# Prompt
# ---------------------------------------------------------------------------
# Testo del RUOLO del modello per ciascun compito. Il codice aggiunge sempre i dati di riferimento (catalogo dei
# valori ammessi) e il formato della risposta che poi legge: un prompt personalizzato non può romperli. Se il testo
# descrive già il formato (contiene "DECISIONE:", "STATUS:" o, per l'override, "\"target\"") il formato non viene
# ripetuto. Le variabili d'ambiente PROMPT_* del .env prevalgono su questa sezione.
#
#   brain_escalation         il Brain decide APPROVA/RESPINGI su un'escalation di un organo
#   brain_escalation_utente  template del messaggio; segnaposto ammessi: {source} {target} {action} {reason}
#                            {readings} {recent_events} (per una graffa letterale: {{ e }})
#   troubleshooting          un dispositivo non ha eseguito un comando: RETRY o ESCALATE
#   override                 traduce una direttiva OVERRIDE dell'operatore in comandi JSON
#   controllo_macro          controllo di routine dello stato globale: OK o MACRO_ADJUSTMENT_REQUIRED
#
# Senza questa sezione valgono i default (app/core/prompt.py).
# Conviene aggiungere al ruolo ciò che vale solo per il tuo impianto. Esempio (tolto il commento, vale dal ciclo
# successivo; il testo sostituisce il ruolo predefinito, quindi riporta anche le sue regole):
#
# [prompt]
# brain_escalation = """
# Sei il Brain di un impianto idroelettrico: decidi sulle escalation degli organi che controllano turbine e paratoie.
# Procedi così:
# 1. Identifica dispositivo, azione proposta e chi la propone.
# 2. Confronta le letture reali con lo storico: c'è un blocco attivo di un attore con priorità maggiore?
# 3. Verifica che il valore proposto sia tra quelli ammessi dal catalogo.
# 4. Nel dubbio, o se l'azione riguarda la sicurezza e i dati sono incompleti, RESPINGI."""
